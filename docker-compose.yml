version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voiceguard-backend
    ports:
      - "8000:8000"
    environment:
      - DEVICE=cpu
      - MODEL_MODE=real
      - DEMO_MODE=false
      - DATABASE_URL=sqlite:///./sih26104.db
    volumes:
      - ./backend/uploads:/app/backend/uploads
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voiceguard-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
